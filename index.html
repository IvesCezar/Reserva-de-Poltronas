<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Reserva de Cadeiras</title>

    <link rel="stylesheet" href="style.css">
   
</head>

<body>

    <h1>Reserva de Cadeiras</h1>

    <p>Clique em uma cadeira para reservar.</p>

    <div id="sala">

        <!-- Linha 1 -->
        <button onclick="reservar(0, 0, this)">1</button>
        <button onclick="reservar(0, 1, this)">2</button>
        <button onclick="reservar(0, 2, this)">3</button>
        <button onclick="reservar(0, 3, this)">4</button>
        <button onclick="reservar(0, 4, this)">5</button>
        <button onclick="reservar(0, 5, this)">6</button>

        <!-- Linha 2 -->
        <button onclick="reservar(1, 0, this)">7</button>
        <button onclick="reservar(1, 1, this)">8</button>
        <button onclick="reservar(1, 2, this)">9</button>
        <button onclick="reservar(1, 3, this)">10</button>
        <button onclick="reservar(1, 4, this)">11</button>
        <button onclick="reservar(1, 5, this)">12</button>

        <!-- Linha 3 -->
        <button onclick="reservar(2, 0, this)">13</button>
        <button onclick="reservar(2, 1, this)">14</button>
        <button onclick="reservar(2, 2, this)">15</button>
        <button onclick="reservar(2, 3, this)">16</button>
        <button onclick="reservar(2, 4, this)">17</button>
        <button onclick="reservar(2, 5, this)">18</button>

        <!-- Linha 4 -->
        <button onclick="reservar(3, 0, this)">19</button>
        <button onclick="reservar(3, 1, this)">20</button>
        <button onclick="reservar(3, 2, this)">21</button>
        <button onclick="reservar(3, 3, this)">22</button>
        <button onclick="reservar(3, 4, this)">23</button>
        <button onclick="reservar(3, 5, this)">24</button>

        <!-- Linha 5 -->
        <button onclick="reservar(4, 0, this)">25</button>
        <button onclick="reservar(4, 1, this)">26</button>
        <button onclick="reservar(4, 2, this)">27</button>
        <button onclick="reservar(4, 3, this)">28</button>
        <button onclick="reservar(4, 4, this)">29</button>
        <button onclick="reservar(4, 5, this)">30</button>

    </div>

    <p id="mensagem"></p>

    <div id="gifOverlay" class="gif-overlay" aria-hidden="true">
        <img id="reserveGif" src="assets/success.gif" alt="Sucesso" onerror="this.onerror=null; this.src='https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif';">
    </div>

    <script src="script.js"></script>

</body>

</html>
